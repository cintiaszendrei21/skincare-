spring:
  application:
    name: skincare-backend
  datasource:
    url: jdbc:h2:file:./data/skincare
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}
